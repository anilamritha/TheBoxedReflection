<!DOCTYPE html>
<!--
  BOXED REFLECTION  ·  PROJECTION PAGE  ·  version B, with projection mapping
  Drag this window onto the projector, then press F for fullscreen.
  It waits for the control page. It does nothing on its own.
-->
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A0F'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23C9A227' opacity='.92'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23C9A227' stroke-opacity='.35' stroke-width='1.5'/%3E%3C/svg%3E">
<title>The Boxed Reflection &middot; projection</title>
<style>
  html, body { margin:0; height:100%; background:#08080C; overflow:hidden; cursor:default; }
  canvas { display:block; }
  /* stop the overlay text highlighting while a corner is being dragged */
  body, #calib { -webkit-user-select:none; user-select:none; }

  /* the calibration overlay sits ON TOP of the canvas and is never warped */
  #calib { position:fixed; inset:0; z-index:10; pointer-events:none;
           font:12px ui-monospace,Menlo,Consolas,monospace; color:#D8D8E6; }
  #calib svg { position:absolute; inset:0; width:100%; height:100%; }
  #calib polygon { fill:none; stroke:#C9A227; stroke-width:1.5; stroke-dasharray:7 6; }
  .handle { position:absolute; width:34px; height:34px; margin:-17px 0 0 -17px;
            border:2px solid #C9A227; border-radius:50%; pointer-events:auto;
            cursor:grab; background:rgba(201,162,39,.14);
            /* touch-action:none is what makes pointer events reliable. Without it
               the browser can decide a drag is a scroll or a swipe and steal it
               halfway through, which reads as the corner "getting stuck". */
            touch-action:none;
            /* above the instruction panel, so corner 1 is never buried under it */
            z-index:3; }
  .handle.is-selected { background:rgba(201,162,39,.4); box-shadow:0 0 0 6px rgba(201,162,39,.12); }
  .handle span { position:absolute; inset:0; display:grid; place-items:center;
                 font-weight:700; font-size:12px; color:#FFE08A; }
  /* centred at the top: every corner is in a corner, so the middle is the one
     place a panel can sit without covering a handle */
  #calib-panel { position:absolute; left:50%; top:26px; transform:translateX(-50%);
                 padding:16px 20px; z-index:2; pointer-events:none;
                 background:rgba(10,10,15,.88); border:1px solid #2A2A38;
                 border-radius:12px; line-height:1.85; }
  #calib-panel b { color:#C9A227; letter-spacing:.14em; display:block; margin-bottom:8px; }
  #calib-panel kbd { background:#1C1C26; border:1px solid #2E2E3C; border-radius:4px;
                     padding:1px 6px; margin-right:7px; color:#FFE08A; }
  .locked   { color:#E8554A; font-weight:700; }
  .unlocked { color:#5FBF8A; font-weight:700; }
  /* a grid to align against, drawn under the handles */
  #calib-grid { position:absolute; inset:0;
    background-image:linear-gradient(rgba(201,162,39,.16) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(201,162,39,.16) 1px, transparent 1px);
    background-size:64px 64px; }
  #flash { position:fixed; right:26px; bottom:26px; z-index:11; padding:11px 18px;
           background:rgba(10,10,15,.9); border:1px solid #2A2A38; border-radius:999px;
           font:12.5px ui-sans-serif,system-ui,sans-serif; color:#D8D8E6;
           opacity:0; transition:opacity .3s ease; pointer-events:none; }
  #flash.is-on { opacity:1; }

</style>
</head>
<body style="background:#08080C">

<div id="calib" hidden>
  <div id="calib-grid"></div>
  <svg><polygon points="0,0 0,0 0,0 0,0"></polygon></svg>
  <div class="handle"><span>1</span></div>
  <div class="handle"><span>2</span></div>
  <div class="handle"><span>3</span></div>
  <div class="handle"><span>4</span></div>
  <div id="calib-panel">
    <b>PROJECTION MAPPING</b>
    <kbd>drag</kbd>move a corner<br>
    <kbd>1-4</kbd>select a corner<br>
    <kbd>arrows</kbd>nudge 1px, hold shift for 10<br>
    <kbd>R</kbd>reset the corners<br>
    <kbd>C</kbd>leave calibration<br>
    <kbd>L</kbd>lock or unlock<br>
    status: <span id="calib-lock" class="unlocked">UNLOCKED</span>
  </div>
</div>
<div id="flash"></div>

<script src="p5.min.js"></script>
<script src="scenarios.js"></script>
<script src="mapping.js"></script>
<script src="show.js"></script>
</body>
</html>
